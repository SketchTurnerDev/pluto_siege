[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pluto_siege"
version = "2.0.0"
description = "PlutoSDR ISM-band RF capture and replay tool (433 MHz, 868 MHz, etc.)."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "SketchTurnerDev" }
]
requires-python = ">=3.9"
dependencies = [
    "pyadi-iio>=0.0.16",
    "pylibiio<1.0",
    "numpy>=1.20.0",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: Console :: Curses",
]

[project.scripts]
pluto_siege = "pluto_siege.ui.screens.main_menu:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pluto_siege*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pluto_siege"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["adi"]
ignore_missing_imports = true
